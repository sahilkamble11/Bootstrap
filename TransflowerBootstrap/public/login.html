<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transflower Store - Login</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="col-md-4 col-lg-3">
    <div class="card shadow-lg">

      <!-- Header -->
      <div class="card-header bg-danger text-white text-center">
        <h4 class="mb-0">Welcome Back 🌼</h4>
      </div>

      <!-- Body -->
      <div class="card-body p-4">
        <form id="loginForm" novalidate>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
            <div class="invalid-feedback">
              Please enter a valid email.
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
            <div class="invalid-feedback">
              Please enter your password.
            </div>
          </div>

          <button type="submit" class="btn btn-danger w-100">
            Login
          </button>

        </form>
              <p class="mt-3 text-center">
        New user? <a href="register.html" class="text-danger">Create an account</a>
      </p>
      </div>

    </div>
  </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
  <div id="loginToast" class="toast text-bg-success border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body">
        ✅ Login successful! Welcome back 🌼
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Login Logic -->
<script>
  const form = document.getElementById('loginForm');

  form.addEventListener('submit', function (event) {
    event.preventDefault();

    if (!form.checkValidity()) {
      form.classList.add('was-validated');
      return;
    }

    // Show toast on successful validation
    const toastEl = document.getElementById('loginToast');
    const toast = new bootstrap.Toast(toastEl);
    toast.show();

    // Optional reset
    form.reset();
    form.classList.remove('was-validated');
  });
</script>

</body>
</html>
